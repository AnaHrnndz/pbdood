# environment.yml — conda/Bioconda environment for PBDOOD
#
# Create/activate:
#     conda env create -f environment.yml      # (or: mamba env create -f environment.yml)
#     conda activate pbdood
#
# Recommended: enable strict channel priority before creating the environment:
#     conda config --set channel_priority strict
#
# NOTE on versions: stable versions are pinned here for reproducibility. If your
# benchmark results were produced with specific versions of mmseqs2/famsa/etc.,
# replace these with those exact versions for an identical environment.

name: pbdood

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  - python=3.10

  # --- De novo clustering (standalone `mmseqs` command used by DOOD.nf) ---
  - mmseqs2=15.6f452

  # --- Phylogenomics (MSA + trees) ---
  - famsa=2.4.1
  - mafft=7.526
  - fasttree=2.1.11

  # --- Build/runtime libs for the pip packages below ---
  - numpy
  - scipy
  - cvxopt              # MinVar rooting in FastRoot
  - pandas
  - cython              # ete4 build (fallback if no wheel)
  - cxx-compiler        # ete4 build (fallback if no wheel)
  - pip

  # --- Pure-Python / self-contained tools installed via pip ---
  - pip:
      - og-delineation @ git+https://github.com/AnaHrnndz/OG_Delineation.git@v0.4.0
      - eggnog-mapper==2.1.13
      - ete4==4.4.0
      - FastRoot==1.5